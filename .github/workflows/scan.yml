name: Jobberto Scan

on:
  schedule:
    # Cron primario: ogni 5 min dalle 05:00 alle 21:59 UTC
    # (copre 07:00-23:59 CEST estivo / 06:00-22:59 CET invernale)
    - cron: '*/5 5-21 * * *'
    # Cron ridondante offset di 2 min: aumenta probabilità run entro finestra 5 min
    - cron: '2-59/5 5-21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jobberto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state database
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: jobberto-state-v2
          restore-keys: |
            jobberto-state-v2
            jobberto-state-

      - name: Run Jobberto scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_STRONG: ${{ secrets.TELEGRAM_CHAT_STRONG }}
          TELEGRAM_CHAT_REVIEW: ${{ secrets.TELEGRAM_CHAT_REVIEW }}
        run: python run.py

      - name: Delete old cache
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete jobberto-state-v2 --repo ${{ github.repository }} || true

      - name: Save state database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: jobberto-state-v2

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobberto-logs
          path: logs/
          retention-days: 7

