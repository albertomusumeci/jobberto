name: Jobberto Scan


on:
  schedule:
    # GitHub Actions usa cron UTC. Per coprire 07:00-23:00 ora italiana (CET/CEST),
    # in UTC significa circa 05:00-21:00 (inverno) o 05:00-21:00 (estate, CEST = UTC+2)
    # Uso una fascia larga 05:00-22:00 UTC per essere sicuro di coprire tutto l'anno.
    # Cron: "*/15 5-22 * * *" = ogni 15 minuti dalle 05:00 alle 22:59 UTC
    - cron: '*/15 6-21 * * *' 
  workflow_dispatch:  # permette esecuzione manuale dal bottone "Run workflow" su GitHub


# Evita esecuzioni concorrenti se una run precedente non è ancora finita
concurrency:
  group: jobberto-scan
  cancel-in-progress: false


jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5


    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Restore state database
        uses: actions/cache@v4
        with:
          path: data/jobs_seen.db
          key: jobberto-state-${{ github.run_id }}
          restore-keys: |
            jobberto-state-


      - name: Run Jobberto scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_STRONG: ${{ secrets.TELEGRAM_CHAT_STRONG }}
          TELEGRAM_CHAT_REVIEW: ${{ secrets.TELEGRAM_CHAT_REVIEW }}
        run: python run.py


      - name: Save state database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs_seen.db
          key: jobberto-state-${{ github.run_id }}


      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobberto-logs
          path: logs/
          retention-days: 7 
